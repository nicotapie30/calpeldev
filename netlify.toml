# Deploy en Netlify. Reemplaza al adapter de Vercel.
#
# El sitio es 100% estático: `astro build` deja todo en `dist` y Netlify solo
# sirve archivos. No hay adapter, no hay functions y no hay variables de
# entorno — el formulario de contacto arma un link de wa.me en el browser.

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  # package.json pide >=22.12.0. Se fija acá para que un cambio del default de
  # Netlify no rompa el build un día cualquiera sin que nadie toque el repo.
  NODE_VERSION = "22"
